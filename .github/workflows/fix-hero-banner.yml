name: Fix hero banner framing

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix hero banner CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/style.css')
          s = p.read_text()
          marker = '/* FINAL HERO FRAME FIX */'
          if marker in s:
              raise SystemExit(0)
          s += '''\n\n/* FINAL HERO FRAME FIX */\n.hero{height:min(500px,40vw)!important;min-height:0!important;max-width:1440px;margin:auto;position:relative;overflow:hidden;background-image:url("https://kommodo.ai/i/FdqS848cNUjuemA1XN0k");background-size:cover;background-position:center}\n.hero-img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;display:block!important}\n.hero-shade{z-index:1}.hero-cta{z-index:2}\n@media(max-width:700px){.hero{height:calc(100vw * 500 / 1440)!important;min-height:0!important;background-size:cover}.hero-img{object-fit:contain!important}}\n'''
          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix top banner framing without crop"
          git push
