name: Repair hero CSS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good style.css
        run: |
          git checkout 200864fcdee095a33206862b0f5b19739561deff -- src/style.css
          printf '\n/* Production hero: preserve full banner frame */\n.hero{height:auto!important;min-height:0!important;aspect-ratio:1440/500!important;overflow:hidden}.hero-img{width:100%%!important;height:100%%!important;object-fit:fill!important;display:block!important}\n@media(max-width:700px){.hero{height:auto!important;min-height:0!important;aspect-ratio:1440/500!important}.hero-img{width:100%%!important;height:100%%!important;object-fit:fill!important;display:block!important}}\n' >> src/style.css
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Repair full site CSS and keep hero full-frame'
          git push
