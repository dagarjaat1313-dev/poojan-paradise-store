<div id="root"></div><link rel="stylesheet" href="/src/product-shop.css?v=20260824"><link rel="stylesheet" href="/src/final-product.css?v=20260824"><style>.pp-pop{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}.pp-box{position:relative;width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fffaf0;border:2px solid #c99a38;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 80px #0008}.pp-close{position:absolute;right:12px;top:10px;width:40px;height:40px;border:0;border-radius:50%;background:#7b1113;color:#fff;font-size:26px}.pp-coins{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pp-card{background:#fff;border:1px solid #ead7a5;border-radius:18px;padding:14px}.pp-card img{width:210px;height:210px;max-width:100%;object-fit:contain}.pp-title{font-size:12px;letter-spacing:3px;color:#a47718;font-weight:800}.pp-box h2{color:#7b1113;margin:8px 0}.pp-card h3{color:#7b1113}@media(max-width:560px){.pp-box{padding:24px 10px}.pp-card img{width:140px;height:140px}.pp-coins{gap:8px}}.pp-policy-links{grid-column:1/-1;border-top:1px solid #a34a3a;margin-top:2px;padding-top:14px;display:flex;justify-content:center;flex-wrap:wrap;gap:0 18px}.pp-policy-links a{display:inline-block!important;color:#e1c5a2!important;text-decoration:none;font-size:9px!important;line-height:1.9;margin:0!important}.pp-policy-links a:hover{color:#fff3dc!important}@media(max-width:700px){.pp-policy-links{gap:0 12px;padding-top:12px}.pp-policy-links a{font-size:8px!important}}</style><script>(function(){function popup(){if(document.getElementById('pp-offer-live'))return;var x=document.createElement('div');x.id='pp-offer-live';x.className='pp-pop';x.innerHTML='<div class="pp-box"><button class="pp-close" aria-label="Close">×</button><div class="pp-title">POOJAN PARADISE</div><h2>🎁 Special Coin Offers</h2><p>Shagun Coin & Para Coin — special rewards for our customers</p><div class="pp-coins"><div class="pp-card"><img src="/offers/shagun%20coin.png" alt="Shagun Coin"><h3>Shagun Coin</h3></div><div class="pp-card"><img src="/offers/para%20coin.png" alt="Para Coin"><h3>Para Coin</h3></div></div></div>';document.body.appendChild(x);x.querySelector('.pp-close').onclick=function(){x.remove()};x.onclick=function(e){if(e.target===x)x.remove()}}function cleanFooter(){var f=document.querySelector('footer');if(!f)return;var cols=f.children;if(cols[2]){Array.from(cols[2].querySelectorAll('a')).forEach(function(a){var t=(a.textContent||'').trim().toLowerCase();if(t==='shipping policy'||t==='return & refund')a.remove()})}if(!f.querySelector('.pp-policy-links')){var p=document.createElement('div');p.className='pp-policy-links';p.innerHTML='<a href="/terms.html">Terms & Conditions</a><a href="/privacy-policy.html">Privacy Policy</a><a href="/shipping-policy.html">Shipping & Delivery</a><a href="/return-refund.html">Return & Refund</a><a href="/cancellation-policy.html">Cancellation</a><a href="/contact-us.html">Contact Us</a>';f.appendChild(p)}}function boot(){popup();cleanFooter();var o=new MutationObserver(function(){cleanFooter()});o.observe(document.body,{childList:true,subtree:true});setTimeout(function(){o.disconnect()},5000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot()})();</script><script type="module" src="/src/main.jsx"></script>
